# Arduino Sensor Driver Configuration

arduino_sensor_parser:
  ros__parameters:
    # Serial port settings
    serial_port: ""                     # Empty = auto-discovery enabled
    device_id_pattern: "Arduino"       # Match devices containing "Arduino" in /dev/serial/by-id/
    baud_rate: 115200                  # Must match Arduino Serial.begin()
    
    # Timeout protection
    timeout_sec: 1.0                   # Publish zero-velocity odom if serial is silent for 1 second
    crc_timeout_sec: 0.5               # Publish sensor error if no CRC-valid packet for 0.5 second
    
    # Encoder parameters (AMT103)
    encoder_cpr: 8192                  # Counts Per Revolution (PPR=2048, CPR=PPR*4)
    wheel_radius_m: 0.029              # Encoder wheel radius in meters (diameter=58mm)
    
    # TF publishing
    publish_tf: true                   # Whether to broadcast odom->base_link transform

    # Encoder direction & IMU calibration
    enc_x_sign: 1.0                   # Set to -1.0 if encoder direction is reversed
    enc_y_sign: 1.0
    imu_yaw_offset_deg: 0.0           # IMU yaw zero-offset in degrees
    zero_heading_on_start: true       # First valid IMU heading after node startup becomes /state_pose2d theta=0

    # Encoder positions relative to robot rotation center, in meters.
    # Robot frame: +X forward, +Y left.
    enc_x_pos_x_m: 0.0
    enc_x_pos_y_m: 0.153102
    enc_y_pos_x_m: -0.153102
    enc_y_pos_y_m: 0.0
