# Pneumatics Configuration

pneu_ctrl:
  ros__parameters:
    # Serial port settings
    serial_port: ""                     # Empty = auto-discovery
    device_id_pattern: "Arduino"        # Match in /dev/serial/by-id/
    baud_rate: 115200                   # Match Arduino Serial.begin()

    # Timeout protection
    timeout_sec: 1.0                    # Set all valves to 0 if no command received
    publish_rate_hz: 20.0               # Watchdog refresh rate

    # Actuator names (order must match joint_pneu_control data array)
    pneu_names: ["arm_gripper", "arm_lift", "arm_stopper"]
