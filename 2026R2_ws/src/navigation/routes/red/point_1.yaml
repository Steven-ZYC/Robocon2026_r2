version: 1
frame_id: map
angle_unit: deg

# Red route: point 1 -> point 2 weapon head pickup verification.
# Assumption: robot and arm are aligned in front of point 1 before mission start.
# Scope: only rack point 1 and point 2 are used.

waypoints:
  wp_middle:
    pose: { x: 0.36, y: 0.0, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0
  wp_point_1:
    pose: { x: 0.36, y: 0.875, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0
  wp_point_1_back:
    pose: { x: 0.36, y: 0.75, yaw: 0.0 }
    pos_tolerance: 0.01
    yaw_tolerance_deg: 1.0
  wp_point_2:
    pose: { x: 0.36, y: 1.075, yaw: 0.0 }
    pos_tolerance: 0.017
    yaw_tolerance_deg: 1.0

profiles:
  red_area:
    speed_mps: 0.4
    yaw_rate_rps: 0.3
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.071
    k_p_y: 0.115
    k_i_y: 0.0
    k_i_x: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 1.0
    max_body_y_mps: 1.0
    curve: cubic_ease

  head_rack_speed:
    # Slow rack approach profile, based on 1/4 Red Area speed limits.
    speed_mps: 0.1
    yaw_rate_rps: 0.075
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_x: 0.0
    k_i_y: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 0.25
    max_body_y_mps: 0.25

actuators:
  arm_yaw_motor:
    type: motor
    motor_id: 5
    speed: 1.0
    positions:
      front: 0.0
      left: -1.5708
      right: 1.5708

  arm_roll_motor:
    type: motor
    motor_id: 6
    speed: 1.0
    positions:
      up: 0.0
      left_90deg: 1.5708
      right_90deg: -1.5708

  arm_gripper:
    type: pneumatic
    states: [open, close]

  arm_lift:
    type: pneumatic
    states: [low, high]

  arm_stopper:
    type: pneumatic
    states: [low, high]

stages:
  # ================================================================
  # 初始化
  # ================================================================
  # 等下游节点 (arm_ctrl_node) ROS2 发现完成 (跨进程发现需要 3-5s)
  - id: init_wait
    type: wait
    duration_s: 1.0

  # ---- 手臂初始姿态 ----
  - id: arm_start_pose
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # ---- M5 转到侧面 (left = 90°)，对准 rack slot ----
  - id: arm_ready
    type: action
    arm:
      arm_yaw_motor: left
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: move_to_middle
    type: navigate
    to: wp_middle
    profile: red_area

  - id: move_to_rack
    type: navigate
    to: wp_point_1
    profile: red_area
    timeout_s: 2.5
    torque_arrival:
      topic: /damiao_feedback
      field: chassis_motor_tau
      op: abs_gte
      abs_threshold_nm: 4.0
      max_age_s: 0.5
      min_elapsed_s: 0.20

  # ---- 等待手臂就位后短暂稳定 ----
  - id: point_1_settle
    type: wait
    duration_s: 1.0

  # ================================================================
  # Point 1: weapon_head_pickup (micro_sweep_10mm)
  #   IR=false 时先退 10mm，再慢速扫过当前位置到 +10mm
  #   on_miss=advance 表示微扫仍未检测到 weapon head 时继续后续 stage
  # ================================================================
  - id: pickup_point_1
    type: weapon_head_pickup
    arm:
      arm_yaw_motor: left
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    search_mode: micro_sweep_10mm
    ir_topic: /arm/ir_status
    ir_field: ir
    ir_timeout_s: 2.0
    slot_count: 1
    slot_spacing_m: 0.2
    on_miss: advance
    micro_sweep:
      # 车体前后微扫；0.0 = body +X 前进方向
      direction_rad: 0.0
      back_distance_m: 0.03
      forward_distance_m: 0.01
      speed_mps: 0.02
      timeout_s: 2.0
      profile: head_rack_speed
      pos_tolerance: 0.003
      yaw_tolerance: 0.05
    step:
      profile: head_rack_speed
      settle_s: 0.15
      pos_tolerance: 0.02
      yaw_tolerance: 0.05
    pickup_sequence:

      # 步骤1: gripper close（夹取）
      - type: arm
        arm_gripper: close
        arm_lift: low
        arm_stopper: low
      
      - type: wait
        duration_s: 1.0

      # 步骤2: lift high（提起 weapon head）
      - type: arm
        arm_gripper: close
        arm_lift: high
        arm_stopper: low

      - type: wait
        duration_s: 1.5

      # 检查有无夹到，未触发IR sensor需要归位
      #  IR=true  → continue：继续释放流程
      #- id: verify_ir
      # type: verify_ir
      #  expected_ir: true
      #  on_true: yaw_to_front
      #  on_false: prepare_point_2_after_failed_grab

      - type: wait
        duration_s: 1.5

      - id: move_to_point_1_back
        type: navigate
        to: wp_point_1_back
        profile: head_rack_speed

      # 步骤7: M5→front (0°)
      - id: yaw_to_front
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: up
        arm_gripper: close
        arm_lift: high
        arm_stopper: low

      - id: wait_1s
        type: wait
        duration_s: 2.0

      # 步骤8: M6→+90°
      - id: roll_left
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: close
        arm_lift: low
        arm_stopper: low

      - id: wait_1s
        type: wait
        duration_s: 1.5

      # 步骤9: stopper high
      - id: stopper_up
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: close
        arm_lift: low
        arm_stopper: high

      - id: wait_0_5s
        type: wait
        duration_s: 1.0

      # 步骤10: 扭矩检测: M5 torque > |2.0| Nm → 松开 gripper
      # 支持的 op 字段: gt(大于) lt(小于) gte(≥) lte(≤) abs_gt(绝对值大于) abs_gte(绝对值≥)
      # 数据来源: /damiao_feedback → motor_5_tau (Nm)，由 global_navigation_node 缓存到 sensor_cache
      - id: check_torque
        type: conditional
        condition:
          topic: /damiao_feedback
          field: motor_5_tau
          op: abs_gt
          value: 1.3
        then: release_gripper
        else: check_torque

      # 步骤11: 松开 gripper
      - id: release_gripper
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: open
        arm_lift: low
        arm_stopper: low

      - id: wait_1s
        type: wait
        duration_s: 1.0
      
      # 步骤12: 归位
      - id: arm_init_pose
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: up
        arm_gripper: open
        arm_lift: low
        arm_stopper: low

      - id: wait_1s
        type: wait
        duration_s: 1.0

      # 步骤6: verify_ir 复检 —— 确认 sensor 已清空（weapon head 已脱离）
      #   无论 true/false 都跳 point_1_done → terminate
      - type: verify_ir
        label: point_1_after_release_sensor_clear
        expected: false
        on_true: wait_before_point_2
        on_false: wait_before_point_2

  # ================================================================
  # Point 1 失败恢复路径 (verify_ir on_false 跳转到这里)
  #   arm 回 open/low 安全姿态 → wait → navigate 到 point 2 → 重试
  # ================================================================
  # ---- 失败安全姿态 ----
  - id: prepare_point_2_after_failed_grab
    type: action
    arm:
      arm_yaw_motor: left
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # ---- 等待安全姿态就位 ----
  - id: wait_before_point_2
    type: wait
    duration_s: 2.0

  # ---- 底盘导航到 point 2（rack 第二个 slot 位置） ----
  - id: move_to_point_2
    type: navigate
    to: wp_point_2
    profile: head_rack_speed
    timeout_s: 2.0
    torque_arrival:
      topic: /damiao_feedback
      field: chassis_motor_tau
      op: abs_gte
      abs_threshold_nm: 3.0
      max_age_s: 0.5
      min_elapsed_s: 0.20

  # ---- Point 2 手臂就位 ----
  - id: point_2_ready
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: point_2_settle
    type: wait
    duration_s: 2.0

  - id: arm_ready_point_2
    type: action
    arm:
      arm_yaw_motor: left
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # ================================================================
  # Point 2: weapon_head_pickup (micro_sweep_10mm)
  #   与 point 1 完全相同的 pickup_sequence，区别：
  #   - on_miss=terminate：point 2 是最后一次重试，不再继续
  #   - verify_ir on_false → point_2_failed_safe_pose → terminate
  # ================================================================
  - id: pickup_point_2
    type: weapon_head_pickup
    arm:
      arm_yaw_motor: left
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    search_mode: micro_sweep_10mm
    ir_topic: /arm/ir_status
    ir_field: ir
    ir_timeout_s: 2.0
    slot_count: 1
    slot_spacing_m: 0.2
    on_miss: terminate
    micro_sweep:
      # Red point 1/2 pickup 需要车体前后微扫；0.0 = body +X 前进方向
      direction_rad: 0.0
      back_distance_m: 0.03
      forward_distance_m: 0.01
      speed_mps: 0.02
      timeout_s: 2.0
      profile: head_rack_speed
      pos_tolerance: 0.003
      yaw_tolerance: 0.05
    step:
      profile: head_rack_speed
      settle_s: 0.15
      pos_tolerance: 0.02
      yaw_tolerance: 0.05
    pickup_sequence:
    
      # 步骤1: gripper close（夹取）
      - type: arm
        arm_gripper: close
        arm_lift: low
        arm_stopper: low

      - type: wait
        duration_s: 1.0

      # 步骤2: lift high（提起）
      - type: arm
        arm_gripper: close
        arm_lift: high
        arm_stopper: low

      - type: wait
        duration_s: 1.0

      # 步骤3: verify_ir 复检 —— 确认抓取
      #   IR=true  → continue：继续释放流程
      #   IR=false → point_2_failed_safe_pose：安全姿态 → terminate
      - type: verify_ir
        label: point_2_after_lift_has_weapon_head
        expected: true
        on_true: continue
        on_false: point_2_failed_safe_pose

      # 步骤7: M5→front (0°)
      - id: yaw_to_front
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: up
        arm_gripper: close
        arm_lift: high
        arm_stopper: low

      - id: wait_1s
        type: wait
        duration_s: 2.0

      # 步骤8: M6→+90°
      - id: roll_right
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: close
        arm_lift: low
        arm_stopper: low

      - id: wait_1s
        type: wait
        duration_s: 1.5

      # 步骤9: stopper high
      - id: stopper_up
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: close
        arm_lift: low
        arm_stopper: high

      - type: wait
        duration_s: 1.0

      - id: move_to_point_1_back
        type: navigate
        to: wp_point_1_back
        profile: head_rack_speed

      # 步骤10: 扭矩检测: M5 torque > |2.0| Nm → 松开 gripper
      # 支持的 op 字段: gt(大于) lt(小于) gte(≥) lte(≤) abs_gt(绝对值大于) abs_gte(绝对值≥)
      # 数据来源: /damiao_feedback → motor_5_tau (Nm)，由 global_navigation_node 缓存到 sensor_cache
      - id: check_torque
        type: conditional
        condition:
          topic: /damiao_feedback
          field: motor_5_tau
          op: abs_gt
          value: 1.3
        then: release_gripper
        else: check_torque

      # 步骤11: 松开 gripper
      - id: release_gripper
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: open
        arm_lift: low
        arm_stopper: low

      - id: wait_1s
        type: wait
        duration_s: 1.0
      
      # 步骤12: 归位
      - id: arm_init_pose
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: up
        arm_gripper: open
        arm_lift: low
        arm_stopper: low

      - id: wait_1s
        type: wait
        duration_s: 1.0

      # 步骤6: verify_ir 复检 —— 确认 sensor 清空
      - type: verify_ir
        label: point_2_after_release_sensor_clear
        expected: false
        on_true: point_2_done
        on_false: point_2_done

  # ================================================================
  # Point 2 失败：arm 回安全姿态 → terminate
  # ================================================================
  - id: point_2_failed_safe_pose
    type: action
    arm:
      arm_yaw_motor: left
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: point_2_failed_done
    type: terminate


  # ================================================================
  # 终点 (point 2 成功)
  # ================================================================
  - id: point_2_done
    type: terminate

