version: 1
frame_id: map
angle_unit: deg

# =============================================================================
# Red start-area edge chassis-only test mission
#
# Active behavior:
#   1. Assume /state_pose2d has been zeroed near the robot start pose.
#   2. Move first along world/map +Y and stop near the start-zone edge.
#   3. Keep the 0.6 m chassis base outside the y=0.875~1.000 m obstacle strip.
#   4. Do not execute arm, pneumatic, conditional, or wait stages.
#
# Coordinate convention:
#   - World/map +X: forward when theta = 0
#   - World/map +Y: left when theta = 0
#   - Body +X: chassis forward
#   - Body +Y: chassis left
#   - yaw/theta positive: counter-clockwise, ROS standard
#   - angle_unit above applies to waypoint pose.yaw and yaw_tolerance.
#
# Supported top-level mission parameters:
#   version:    mission schema marker, currently informational
#   frame_id:   frame name recorded by mission config, usually "map"
#   angle_unit: "deg" or "rad"; MissionExecutor converts waypoint angles to rad
#   yaw_unit:   alias of angle_unit if you prefer that name
#
# ROS node parameters are NOT read from this mission YAML. Set them in launch or
# config/global_nav_params.yaml:
#   mission_file:           path to this YAML
#   control_rate_hz:        executor update rate, default 50.0 Hz
#   arrived_stable_count:   arrival must be true for this many cycles, default 5
#   pose_timeout_s:         stop publishing motion if /state_pose2d is stale
# =============================================================================

waypoints:
  # Optional waypoint fields:
  #   pose.x / pose.y:       target position in meters, world/map frame
  #   pose.yaw:              target yaw in angle_unit
  #   pos_tolerance:         arrival XY tolerance in meters, default 0.05
  #   yaw_tolerance:         arrival yaw tolerance in angle_unit
  #   yaw_tolerance_deg:     arrival yaw tolerance in degrees; overrides yaw_tolerance
  wp_start:
    pose: { x: 0.0, y: 0.0, yaw: 0.0 }

  wp_start_edge_y:
    # 出发区 y 边缘为 0.8 m；障碍物从 y=0.875 m 开始。
    # 车底/车宽按 0.6 m 估算，先用 y=0.575 m 作为保守测试目标。
    pose: { x: 0.0, y: 0.575, yaw: 0.0 }
    pos_tolerance: 0.01
    yaw_tolerance_deg: 3.0

profiles:
  # Profile fields read by MissionExecutor / Tracker:
  #   speed_mps:        translational speed limit and tracker cruise speed (m/s)
  #   yaw_rate_rps:     angular velocity limit (rad/s)
  #   start_radius_m:   cubic-ease acceleration distance from stage start (m)
  #   end_radius_m:     cubic-ease deceleration distance before target (m)
  #   min_speed_scale:  minimum translation alpha while not arrived, 0.0-1.0
  #   k_p_x:            body-frame forward(X) position P gain, default 0.5
  #   k_p_y:            body-frame lateral(Y) position P gain, default 0.5
  #   k_i_x:            body-frame forward(X) position I gain, default 0.0
  #   k_i_y:            body-frame lateral(Y) position I gain, default 0.0
  #   k_d_x:            body-frame forward(X) position D gain, default 0.0
  #   k_d_y:            body-frame lateral(Y) position D gain, default 0.0
  #   xy_integral_max:  XY integral anti-windup clamp, default 0.0 (disabled)
  #   k_cte_p:          CTE lateral P gain (legacy, overridden by k_p_x/y if either set)
  #   k_heading_p:      heading P gain, default 1.0
  #   k_heading_d:      heading D gain (damping), default 0.0
  #   max_lateral_mps:  lateral correction speed cap (m/s), default 0.005
  #   max_body_x_mps:   body-frame forward speed cap (m/s), default = max_lateral_mps
  #   max_body_y_mps:   body-frame lateral speed cap (m/s), default = max_lateral_mps
  #
  # Tuning order: P first → D if oscillating → I last (only if steady error)
  # XY split mode (k_p_x / k_p_y): body-frame PID control.
  #   World-frame error rotated to body, then per-axis:
  #   vx_body = kp*e + ki*∫e + kd*de, vy_body = kp*e + ki*∫e + kd*de.
  #   I/D gains default to 0.0 — backward-compatible pure P when unset.
  #   xy_integral_max clamps accumulated integral (anti-windup), 0 = disabled.
  #
  # Hardcoded internally:
  #   curve:            executor always uses "cubic_ease"
  #
  # Team speed convention for chassis tests (scaled 5x vs original):
  #   slow   = 0.01 m/s
  #   medium = 0.05  m/s
  #   fast   = 0.05  m/s
  slow:
    speed_mps: 0.085
    yaw_rate_rps: 0.5
    start_radius_m: 0.20
    end_radius_m: 0.20
    min_speed_scale: 0.20
    k_p_x: 0.086
    k_p_y: 0.08
    k_d_x: 0.005
    k_d_y: 0.01
    k_heading_p: 0.02
    k_heading_d: 0.0
    max_body_x_mps: 0.1
    max_body_y_mps: 0.1
    curve: cubic_ease

  medium:
    speed_mps: 0.05
    yaw_rate_rps: 0.6
    start_radius_m: 0.25
    end_radius_m: 0.25
    min_speed_scale: 0.20
    curve: cubic_ease

  fast:
    speed_mps: 0.01
    yaw_rate_rps: 0.6
    start_radius_m: 0.35
    end_radius_m: 0.35
    min_speed_scale: 0.20
    curve: cubic_ease

actuators: {}
# Actuator examples only; keep commented for this chassis-only mission.
# actuators:
#   arm_yaw_motor:
#     type: motor
#     motor_id: 5
#     speed: 3.0
#     positions:
#       front: 0.0
#       mid: 1.57
#       back: 3.14
#   arm_gripper:
#     type: pneumatic
#     index: 0
#     states: [open, close]

stages:
  # Supported stage fields:
  #   navigate:    id, type, to, profile
  #   arm:         id, type, plus actuator-name: semantic-state pairs
  #   wait:        id, type, duration_s
  #   sequential:  id, type, steps: [...]
  #   parallel:    id, type, actions: [...], wait_until: all_complete
  #   conditional: id, type, condition, then, else
  #   terminate:   id, type
  #
  # Conditional condition fields currently supported:
  #   topic: /arduino/raw_sensor_data or /damiao_feedback
  #   field: cached sensor field name
  #   op: gt / lt / gte / lte
  #   value: threshold
  #
  # This mission intentionally uses only one navigate stage. On arrival,
  # MissionExecutor publishes zero /local_driving once and then reports DONE.
  - id: nav_start_edge_y
    type: navigate
    to: wp_start_edge_y
    profile: slow

# Example stages for future missions; do not uncomment for this test.
# - id: wait_stable
#   type: wait
