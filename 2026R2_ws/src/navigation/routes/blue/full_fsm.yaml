      to: wp_origin
      profile: red_area

  - id: slot5_to_middle
    type: action
    chassis:
      to: wp_middle
      profile: red_area

  - id: slot5_arm_right
    type: action
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: slot5_wait_pre
    type: wait
    duration_s: 1.0
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: slot5_to_point
    type: action
    chassis:
      to: wp_point_5
      profile: red_area
      timeout_s: 3.5
      torque_arrival:
        topic: /damiao_feedback
        field: motor_1_tau
        op: abs_gte
        abs_threshold_nm: 4.0
        max_age_s: 0.5
        min_elapsed_s: 0.20

  - id: slot5_settle
    type: wait
    duration_s: 1.0
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: slot5_pickup
    type: weapon_head_pickup
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    search_mode: micro_sweep_10mm
    ir_topic: /arm/ir_status
    ir_field: ir
    ir_timeout_s: 2.0
    on_miss: terminate
    micro_sweep:
      direction_rad: 0.0
      back_distance_m: 0.01
      forward_distance_m: 0.01
      speed_mps: 0.015
      timeout_s: 2.0
      profile: head_rack_speed
      pos_tolerance: 0.003
      yaw_tolerance: 0.05
    pickup_sequence:
      - type: pipeline
        template: slot_pickup
        vars:
          prefix: slot5
          roll_dock: right_90deg
          release_wait_s: 0.8
      # retry
      - id: slot5_retry_arm
        type: arm
        arm_yaw_motor: right
        arm_roll_motor: up
        arm_gripper: open
        arm_lift: low
        arm_stopper: low
      - type: pipeline
        template: retry_grip
      - id: slot5_check_ir_2
        type: conditional
        condition:
          topic: /arm/ir_status
          field: ir
          op: gt
          value: 0
        then: slot5_docking_start
        else: slot5_exit_miss
      - id: slot5_exit_miss
        type: verify_ir
        expected: true
        on_false: terminate

  - id: slot5_success
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: slot5_done
    type: terminate
