      to: wp_point_2
      profile: red_area
      timeout_s: 3.5
      torque_arrival:
        topic: /damiao_feedback
        field: motor_1_tau
        op: abs_gte
        abs_threshold_nm: 4.0
        max_age_s: 0.5
        min_elapsed_s: 0.20

  # success: prepare for slot 2
  - id: slot1_success
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # ================================================================
  # Slot 2 — wp_point_2 (0.56, -0.875)
