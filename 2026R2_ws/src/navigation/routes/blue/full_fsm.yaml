version: 1
frame_id: map
angle_unit: deg

# Blue field: full FSM for 5 weapon head rack points.
# Robot starts near origin, arm at init pose.
# Each cycle: origin → wp_middle → arm right → wp_point_N (torque early quit + timeout)
# → weapon_head_pickup (micro_sweep_10mm) → docking at wp_docking → next point.
# Miss path: offset 2.5cm body+Y → cross to next point X → approach next point.

waypoints:
  wp_origin:
    pose: { x: 0.0, y: 0.0, yaw: 0.0 }
    pos_tolerance: 0.05
    yaw_tolerance_deg: 3.0

  wp_middle:
    pose: { x: 0.36, y: 0.0, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0

  wp_docking:
    pose: { x: 0.36, y: -0.85, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0

  wp_point_1:
    pose: { x: 0.36, y: -0.875, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0

  wp_point_2:
    pose: { x: 0.56, y: -0.875, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0

  wp_point_3:
    pose: { x: 0.76, y: -0.875, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0

  wp_point_4:
    pose: { x: 0.96, y: -0.875, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0

  wp_point_5:
    pose: { x: 1.16, y: -0.875, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0

  wp_point_2_offset:
    pose: { x: 0.56, y: -0.85, yaw: 0.0 }
    pos_tolerance: 0.01
    yaw_tolerance_deg: 1.0

  wp_point_3_offset:
    pose: { x: 0.76, y: -0.85, yaw: 0.0 }
    pos_tolerance: 0.01
    yaw_tolerance_deg: 1.0

  wp_point_4_offset:
    pose: { x: 0.96, y: -0.85, yaw: 0.0 }
    pos_tolerance: 0.01
    yaw_tolerance_deg: 1.0

  wp_point_5_offset:
    pose: { x: 1.16, y: -0.85, yaw: 0.0 }
    pos_tolerance: 0.01
    yaw_tolerance_deg: 1.0

profiles:
  red_area:
    speed_mps: 0.4
    yaw_rate_rps: 0.3
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_y: 0.0
    k_i_x: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 1.0
    max_body_y_mps: 1.0
    curve: cubic_ease

  head_rack_speed:
    # 1/4 Red Area profile speed limits.
    speed_mps: 0.1
    yaw_rate_rps: 0.075
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_x: 0.0
    k_i_y: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 0.25
    max_body_y_mps: 0.25

actuators:
  arm_yaw_motor:
    type: motor
    motor_id: 5
    speed: 1.0
    positions:
      front: 0.0
      left: -1.5708
      right: 1.5708

  arm_roll_motor:
    type: motor
    motor_id: 6
    speed: 1.0
    positions:
      up: 0.0
      right_90deg: 1.5708
      left_90deg: -1.5708

  arm_gripper:
    type: pneumatic
    states: [open, close]

  arm_lift:
    type: pneumatic
    states: [low, high]

  arm_stopper:
    type: pneumatic
    states: [low, high]

templates:
  # Retry grip: close → lift high. Used after retry_arm in miss path.
  retry_grip:
    - type: wait
      duration_s: 1.0
    - type: arm
      arm_gripper: close
      arm_lift: low
      arm_stopper: low
    - type: wait
      duration_s: 1.0
    - type: arm
      arm_gripper: close
      arm_lift: high
      arm_stopper: low
    - type: wait
      duration_s: 1.0

  # Full slot pickup: grip -> IR check -> docking -> torque-wait -> release.
  # Vars: {prefix} (e.g. slot1), {roll_dock} (right_90deg), {release_wait_s}
  # Jumps to {prefix}_retry_arm on IR miss -- that step is defined in the
  # parent pickup_sequence, outside this template.
  slot_pickup:
    # -- grip + lift --
    - type: arm
      arm_gripper: close
      arm_lift: low
      arm_stopper: low
    - type: wait
      duration_s: 1.0
    - type: arm
      arm_gripper: close
      arm_lift: high
      arm_stopper: low
    - type: wait
      duration_s: 1.0
    # -- IR check 1 --
    - id: "{prefix}_check_ir_1"
      type: conditional
      condition:
        topic: /arm/ir_status
        field: ir
        op: gt
        value: 0
      then: "{prefix}_docking_start"
      else: "{prefix}_retry_arm"
    # === DOCKING PATH ===
    - id: "{prefix}_docking_start"
      type: arm
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: close
      arm_lift: low
      arm_stopper: low
    - type: wait
      duration_s: 1.0
    - id: "{prefix}_stopper_up"
      type: arm
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: close
      arm_lift: low
      arm_stopper: high
    - type: wait
      duration_s: 1.0
    - id: "{prefix}_docking_nav"
      type: action
      arm:
        arm_yaw_motor: front
        arm_roll_motor: "{roll_dock}"
        arm_gripper: close
        arm_lift: low
        arm_stopper: high
      chassis:
        to: wp_docking
        profile: head_rack_speed
    - id: "{prefix}_check_torque"
      type: conditional
      condition:
        topic: /damiao_feedback
        field: motor_5_tau
        op: abs_gt
        value: 1.3
      then: "{prefix}_release"
      else: "{prefix}_check_torque"
    - id: "{prefix}_release"
      type: arm
      arm_yaw_motor: front
      arm_roll_motor: "{roll_dock}"
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    - type: wait
      duration_s: "{release_wait_s}"
    - type: arm
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    - type: verify_ir
      label: "{prefix}_after_release_sensor_clear"
      expected: false
      on_true: continue
      on_false: continue


stages:
  # ================================================================
  # 初始化
  # ================================================================
  - id: init_wait
    type: wait
    duration_s: 1.0

  - id: arm_start_pose
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # ================================================================
  # Slot 1 — wp_point_1 (0.36, -0.875)
  # ================================================================
  - id: slot1_to_origin
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    chassis:
      to: wp_origin
      profile: red_area

  - id: slot1_to_middle
    type: action
    chassis:
      to: wp_middle
      profile: red_area

  - id: slot1_arm_right
    type: action
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: slot1_wait_pre
    type: wait
    duration_s: 1.0
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: slot1_to_point
    type: action
    chassis:
      to: wp_point_1
      profile: red_area
      timeout_s: 3.5
      torque_arrival:
        topic: /damiao_feedback
        field: motor_1_tau
        op: abs_gte
        abs_threshold_nm: 4.0
        max_age_s: 0.5
        min_elapsed_s: 0.20

  - id: slot1_settle
    type: wait
    duration_s: 1.0
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: slot1_pickup
    type: weapon_head_pickup
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    search_mode: micro_sweep_10mm
    ir_topic: /arm/ir_status
    ir_field: ir
    ir_timeout_s: 2.0
    on_miss: advance
    micro_sweep:
      direction_rad: 0.0
      back_distance_m: 0.01
      forward_distance_m: 0.01
      speed_mps: 0.015
      timeout_s: 2.0
      profile: head_rack_speed
      pos_tolerance: 0.003
      yaw_tolerance: 0.05
    pickup_sequence:
      - type: pipeline
        template: slot_pickup
        vars:
          prefix: slot1
          roll_dock: right_90deg
          release_wait_s: 0.8
      # retry
      - id: slot1_retry_arm
        type: arm
        arm_yaw_motor: right
        arm_roll_motor: up
        arm_gripper: open
        arm_lift: low
        arm_stopper: low
      - type: pipeline
        template: retry_grip
      - id: slot1_check_ir_2
        type: conditional
        condition:
          topic: /arm/ir_status
          field: ir
          op: gt
          value: 0
        then: slot1_docking_start
        else: slot1_exit_miss
      - id: slot1_exit_miss
        type: verify_ir
        expected: true
        on_false: advance

  # miss recovery: offset 2.5cm body+Y → cross to point 2 X → approach point 2
  - id: slot1_miss_offset
    type: action
    chassis:
      to: wp_docking
      profile: head_rack_speed

  - id: slot1_miss_cross
    type: action
    chassis:
      to: wp_point_2_offset
      profile: head_rack_speed

  - id: slot1_miss_next
    type: action
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
