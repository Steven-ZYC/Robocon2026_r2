version: 1
frame_id: map
angle_unit: deg

# Blue route: point 1 -> point 2 weapon head pickup verification.
# Assumption: robot and arm are aligned in front of point 1 before mission start.
# Scope: only rack point 1 and point 2 are used.

waypoints:
  wp_middle:
    pose: { x: 0.36, y: 0.0, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0
  wp_point_1:
    pose: { x: 0.36, y: -0.875, yaw: 0.0 }
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0
  wp_point_2:
    pose: { x: 0.36, y: -0.875, yaw: 0.0 }
    pos_tolerance: 0.017
    yaw_tolerance_deg: 1.0

profiles:
  red_area:
    speed_mps: 0.4
    yaw_rate_rps: 0.3
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_y: 0.0
    k_i_x: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 1.0
    max_body_y_mps: 1.0
    curve: cubic_ease

  head_rack_speed:
    # Slow rack approach profile, based on 1/4 Red Area speed limits.
    speed_mps: 0.1
    yaw_rate_rps: 0.075
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_x: 0.0
    k_i_y: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 0.25
    max_body_y_mps: 0.25

actuators:
  arm_yaw_motor:
    type: motor
    motor_id: 5
    speed: 1.0
    positions:
      front: 0.0
      left: -1.5708
      right: 1.5708

  arm_roll_motor:
    type: motor
    motor_id: 6
    speed: 1.0
    positions:
      up: 0.0
      right_90deg: 1.5708
      left_90deg: -1.5708

  arm_gripper:
    type: pneumatic
    states: [open, close]

  arm_lift:
    type: pneumatic
    states: [low, high]

  arm_stopper:
    type: pneumatic
    states: [low, high]

stages:
  # ==================================================
  # 初始化
  # ==================================================
  # 等下游节点 ROS2 发现完成
  - id: init_wait
    type: wait
    duration_s: 1.0

  # 手臂初始姿态：M5=front, M6=up, open/low
  - id: arm_start_pose
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # M5 → right (90°) 对准 rack slot
  - id: arm_ready
    type: action
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # 底盘导航 middle → point 1
  - id: move_to_middle
    type: action
    chassis:
      to: wp_middle
      profile: red_area

  # 接近 point 1（torque early quit + timeout）
  - id: move_to_rack
    type: action
    chassis:
      to: wp_point_1
      profile: red_area
      timeout_s: 3.5
      torque_arrival:
        topic: /damiao_feedback
        field: motor_1_tau
        op: abs_gte
        abs_threshold_nm: 4.0
        max_age_s: 0.5
        min_elapsed_s: 0.20

  # 手臂稳定等待
  - id: point_1_settle
    type: wait
    duration_s: 1.0
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # ================================================================
  # Point 1: weapon_head_pickup (micro_sweep_10mm)
  #   body +X 前后 10mm 微扫，检测到 IR 后夹取 + 扭矩释放
  # ================================================================
  - id: pickup_point_1
    type: weapon_head_pickup
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    search_mode: micro_sweep_10mm
    ir_topic: /arm/ir_status
    ir_field: ir
    ir_timeout_s: 2.0
    slot_count: 1
    slot_spacing_m: 0.2
    on_miss: advance
    micro_sweep:
      direction_rad: 0.0
      back_distance_m: 0.01
      forward_distance_m: 0.01
      speed_mps: 0.02
      timeout_s: 2.0
      profile: head_rack_speed
      pos_tolerance: 0.003
      yaw_tolerance: 0.05
    step:
      profile: head_rack_speed
      settle_s: 0.15
      pos_tolerance: 0.02
      yaw_tolerance: 0.05
    pickup_sequence:

      # 1: gripper close（夹取）
      - type: arm
        arm_gripper: close
        arm_lift: low
        arm_stopper: low
      - type: wait
        duration_s: 1.0

      # 2: lift high（提起）
      - type: arm
        arm_gripper: close
        arm_lift: high
        arm_stopper: low
      - type: wait
        duration_s: 1.0

      # 3: M5→front (0°), M6=up, close/high
      - id: yaw_to_front
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: up
        arm_gripper: close
        arm_lift: high
        arm_stopper: low
      - id: wait_1s
        type: wait
        duration_s: 1.0

      # 4: M6→left_90deg (-90°), lift→low
      - id: roll_right
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: close
        arm_lift: low
        arm_stopper: low
      - id: wait_1s_b
        type: wait
        duration_s: 1.0

      # 5: stopper high
      - id: stopper_up
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: close
        arm_lift: low
        arm_stopper: high
      - id: wait_0_5s
        type: wait
        duration_s: 1.0

      # 6: 扭矩检测 — abs(motor_5_tau) > 2.0Nm → release
      - id: check_torque
        type: conditional
        condition:
          topic: /damiao_feedback
          field: motor_5_tau
          op: abs_gt
          value: 2.0
        then: check_torque_timeout
        else: check_torque

      - id: check_torque_timeout
        type: wait
        duration_s: 0.3
        on_timeout: release_gripper
        on_event: check_torque

      # 7: gripper open（释放）
      - id: release_gripper
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: left_90deg
        arm_gripper: open
        arm_lift: low
        arm_stopper: low
      - id: wait_1s_c
        type: wait
        duration_s: 1.0

      # 8: 归位 init pose
      - id: arm_init_pose
        type: arm
        arm_yaw_motor: front
        arm_roll_motor: up
        arm_gripper: open
        arm_lift: low
        arm_stopper: low
      - id: wait_1s_d
        type: wait
        duration_s: 1.0

      # 9: IR 复检 — 确认 sensor 清空（无论结果均 terminate）
      - type: verify_ir
        label: point_1_after_release_sensor_clear
        expected: false
        on_true: point_1_done
        on_false: point_1_done

  # ================================================================
  # Point 1 失败恢复路径 → point 2
  # ================================================================
  # 安全姿态：M5=right, open/low
  - id: prepare_point_2_after_failed_grab
    type: action
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # 等待安全姿态就位
  - id: wait_before_point_2
    type: wait
    duration_s: 0.2
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # 导航到 point 2
  - id: move_to_point_2
    type: action
    chassis:
      to: wp_point_2
      profile: head_rack_speed

  # Point 2 手臂就位：M5=front, open/low
  - id: point_2_ready
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: point_2_settle
    type: wait
    duration_s: 0.2
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # M5 → right, 对准 point 2 slot
  - id: arm_ready_point_2
    type: action
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  # ================================================================
  # Point 2: weapon_head_pickup (micro_sweep_10mm)
  #   与 point 1 相同的 pickup_sequence。区别：
  #   - on_miss=terminate（最后一次重试）
  #   - verify_ir on_false → point_2_failed_safe_pose → terminate
  # ================================================================
  - id: pickup_point_2
    type: weapon_head_pickup
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low
    search_mode: micro_sweep_10mm
    ir_topic: /arm/ir_status
    ir_field: ir
    ir_timeout_s: 2.0
    slot_count: 1
    slot_spacing_m: 0.2
    on_miss: terminate
    micro_sweep:
      direction_rad: 0.0
      back_distance_m: 0.01
      forward_distance_m: 0.01
      speed_mps: 0.015
      timeout_s: 5.0
      profile: head_rack_speed
      pos_tolerance: 0.003
      yaw_tolerance: 0.05
    step:
      profile: head_rack_speed
      settle_s: 0.15
      pos_tolerance: 0.02
      yaw_tolerance: 0.05
    pickup_sequence:
      # 1: gripper close（夹取）
      - type: arm
        arm_gripper: close
        arm_lift: low
        arm_stopper: low
      - type: wait
        duration_s: 0.15
      # 2: lift high（提起）
      - type: arm
        arm_gripper: close
        arm_lift: high
        arm_stopper: low
      - type: wait
        duration_s: 0.20
      # 3: IR 复检 — 确认抓取
      - type: verify_ir
        label: point_2_after_lift_has_weapon_head
        expected: true
        on_true: continue
        on_false: point_2_failed_safe_pose
      # 4: lift low, gripper open（放回）
      - type: arm
        arm_gripper: close
        arm_lift: low
        arm_stopper: low
      - type: wait
        duration_s: 0.15
      - type: arm
        arm_gripper: open
        arm_lift: low
        arm_stopper: low
      - type: wait
        duration_s: 0.20
      # 5: lift high（离开 rack）
      - type: arm
        arm_gripper: open
        arm_lift: high
        arm_stopper: low
      - type: wait
        duration_s: 0.20
      # 6: IR 复检 — 确认 sensor 清空
      - type: verify_ir
        label: point_2_after_release_sensor_clear
        expected: false
        on_true: point_2_done
        on_false: point_2_done

  # ================================================================
  # Point 2 失败：安全姿态 → terminate
  # ================================================================
  - id: point_2_failed_safe_pose
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: up
      arm_gripper: open
      arm_lift: low
      arm_stopper: low

  - id: point_2_failed_done
    type: terminate

  # ================================================================
  # 终点
  # ================================================================
  - id: point_1_done
    type: terminate

  - id: point_2_done
    type: terminate

