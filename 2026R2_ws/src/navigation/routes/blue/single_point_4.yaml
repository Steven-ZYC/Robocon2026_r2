# Generated from routes/blue/full_fsm.yaml by scripts/generate_single_point_routes.py.
# Standalone blue Point 4: origin -> middle -> offset -> pickup -> docking -> terminate.
version: 1
frame_id: map
angle_unit: deg
waypoints:
  wp_origin:
    pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pos_tolerance: 0.05
    yaw_tolerance_deg: 3.0
  wp_middle:
    pose:
      x: 0.36
      y: 0.0
      yaw: 0.0
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0
  wp_docking_middle:
    pose:
      x: 0.36
      y: -0.65
      yaw: 0.0
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0
  wp_docking:
    pose:
      x: 0.36
      y: -0.875
      yaw: 0.0
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0
  wp_point_4_offset:
    pose:
      x: 0.96
      y: -0.65
      yaw: 0.0
    pos_tolerance: 0.01
    yaw_tolerance_deg: 1.0
  wp_point_4:
    pose:
      x: 0.96
      y: -0.875
      yaw: 0.0
    pos_tolerance: 0.005
    yaw_tolerance_deg: 1.0
profiles:
  red_area:
    speed_mps: 0.4
    yaw_rate_rps: 0.3
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_y: 0.0
    k_i_x: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 1.0
    max_body_y_mps: 1.0
    curve: cubic_ease
  head_rack_speed:
    speed_mps: 0.1
    yaw_rate_rps: 0.075
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_x: 0.0
    k_i_y: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 0.25
    max_body_y_mps: 0.25
actuators:
  arm_yaw_motor:
    type: motor
    motor_id: 5
    speed: 1.0
    positions:
      front: 0.0
      left: -1.5708
      right: 1.5708
  arm_roll_motor:
    type: motor
    motor_id: 6
    speed: 1.0
    positions:
      up: 0.0
      right_90deg: -1.5708
      left_90deg: 1.5708
  arm_gripper:
    type: pneumatic
    states:
    - open
    - close
  arm_lift:
    type: pneumatic
    states:
    - low
    - high
  arm_stopper:
    type: pneumatic
    states:
    - low
    - high
templates:
  retry_grip:
  - type: wait
    duration_s: 1.0
  - type: arm
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: close
    arm_lift: low
    arm_stopper: low
  - type: wait
    duration_s: 1.0
  - type: arm
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: close
    arm_lift: high
    arm_stopper: low
  - type: wait
    duration_s: 1.0
  slot_pickup:
  - type: wait
    duration_s: 1.0
  - type: arm
    arm_gripper: close
    arm_lift: low
    arm_stopper: low
  - type: wait
    duration_s: 1.0
  - type: arm
    arm_gripper: close
    arm_lift: high
    arm_stopper: low
  - type: wait
    duration_s: 1.0
  docking_release:
  - id: '{prefix}_back_nav'
    type: action
    arm:
      arm_yaw_motor: right
      arm_roll_motor: up
      arm_gripper: close
      arm_lift: high
      arm_stopper: low
    chassis:
      to: '{back_point}'
      profile: head_rack_speed
  - id: '{prefix}_lower'
    type: arm
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: close
    arm_lift: low
    arm_stopper: low
  - type: wait
    duration_s: 1.0
  - id: '{prefix}_docking_start'
    type: arm
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_gripper: close
    arm_lift: low
    arm_stopper: low
  - type: wait
    duration_s: 1.5
  - id: '{prefix}_roll'
    type: arm
    arm_yaw_motor: front
    arm_roll_motor: '{roll_dock}'
    arm_gripper: close
    arm_lift: low
    arm_stopper: low
  - type: wait
    duration_s: 2.0
  - id: '{prefix}_stopper_up'
    type: arm
    arm_yaw_motor: front
    arm_roll_motor: '{roll_dock}'
    arm_gripper: close
    arm_lift: low
    arm_stopper: high
  - type: wait
    duration_s: 1.0
  - id: '{prefix}_docking_middle_nav'
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: '{roll_dock}'
      arm_gripper: close
      arm_lift: low
      arm_stopper: high
    chassis:
      to: '{docking_middle}'
      profile: head_rack_speed
  - id: '{prefix}_docking_nav'
    type: action
    arm:
      arm_yaw_motor: front
      arm_roll_motor: '{roll_dock}'
      arm_gripper: close
      arm_lift: low
      arm_stopper: high
    chassis:
      to: wp_docking
      profile: head_rack_speed
  - id: '{prefix}_check_torque'
    type: conditional
    condition:
      topic: /damiao_feedback
      field: motor_5_tau
      op: abs_gt
      value: 1.3
    then: '{prefix}_release'
    else: '{prefix}_check_torque'
  - id: '{prefix}_release'
    type: arm
    arm_yaw_motor: front
    arm_roll_motor: '{roll_dock}'
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
  - type: wait
    duration_s: 1.0
  - type: arm
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
  - type: wait
    duration_s: 1.0
  - type: arm
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
  - type: wait
    duration_s: 1.0
stages:
- id: init_wait
  type: wait
  duration_s: 1.0
- id: arm_start_pose
  type: action
  arm:
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
- id: slot4_single_to_middle
  type: action
  chassis:
    to: wp_middle
    profile: red_area
- id: slot4_arm_right
  type: action
  arm:
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
- id: slot4_single_to_offset
  type: action
  chassis:
    to: wp_point_4_offset
    profile: red_area
- id: slot4_wait_pre
  type: wait
  duration_s: 1.0
  arm:
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
- id: slot4_to_point
  type: action
  chassis:
    to: wp_point_4
    profile: red_area
    timeout_s: 3.5
    torque_arrival:
      topic: /damiao_feedback
      field: chassis_motor_tau
      op: abs_gte
      abs_threshold_nm: 4.0
      max_age_s: 0.5
      min_elapsed_s: 0.2
- id: slot4_settle
  type: wait
  duration_s: 1.0
  arm:
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
- id: slot4_pickup
  type: weapon_head_pickup
  arm:
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
  search_mode: micro_sweep_10mm
  ir_topic: /arm/ir_status
  ir_field: ir
  ir_timeout_s: 2.0
  on_miss: advance
  micro_sweep:
    direction_rad: 0.0
    back_distance_m: 0.01
    forward_distance_m: 0.01
    speed_mps: 0.02
    timeout_s: 2.0
    profile: head_rack_speed
    pos_tolerance: 0.003
    yaw_tolerance: 0.05
  pickup_sequence:
  - type: pipeline
    template: slot_pickup
    vars:
      prefix: slot4
  - id: slot4_check_ir_1
    type: conditional
    condition:
      topic: /arm/ir_status
      field: ir
      op: gt
      value: 0
    then: slot4_back_nav
    else: slot4_retry_arm
  - id: slot4_retry_arm
    type: arm
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
  - type: pipeline
    template: retry_grip
  - id: slot4_check_ir_2
    type: conditional
    condition:
      topic: /arm/ir_status
      field: ir
      op: gt
      value: 0
    then: slot4_back_nav
    else: slot4_exit_miss
  - id: slot4_exit_miss
    type: verify_ir
    expected: true
    on_false: slot4_single_miss_retreat
  - type: pipeline
    template: docking_release
    vars:
      prefix: slot4
      back_point: wp_point_4_offset
      docking_middle: wp_docking_middle
      roll_dock: right_90deg
      release_wait_s: 0.8
  - id: slot4_ir_confirmed
    type: verify_ir
    expected: true
    on_true: slot4_single_success_finish
- id: slot4_single_miss_retreat
  type: action
  arm:
    arm_yaw_motor: right
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
  chassis:
    to: wp_point_4_offset
    profile: head_rack_speed
- id: slot4_single_miss_finish
  type: action
  arm:
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
- id: slot4_single_miss_wait
  type: wait
  duration_s: 1.0
  arm:
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
- id: slot4_single_miss_done
  type: terminate
- id: slot4_single_success_finish
  type: action
  arm:
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
- id: slot4_single_finish_wait
  type: wait
  duration_s: 1.0
  arm:
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low
- id: slot4_single_success_done
  type: terminate
