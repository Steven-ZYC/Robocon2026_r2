version: 1
frame_id: map

# ===== 坐标 =====
waypoints:
  wp_start:    { pose: { x: 0.0, y: 0.0, yaw: 0.0 } }
  wp_mid:      { pose: { x: 1.0, y: 0.0, yaw: 0.0 } }
  wp_target:   { pose: { x: 1.0, y: 0.5, yaw: 1.57 } }
  wp_return:   { pose: { x: 0.0, y: 0.0, yaw: 0.0 } }

# ===== 导航预设 =====
profiles:
  slow:   { speed_mps: 0.3, yaw_rate_rps: 0.8, start_radius_m: 0.2, end_radius_m: 0.2 }
  normal: { speed_mps: 0.6, yaw_rate_rps: 1.5, start_radius_m: 0.3, end_radius_m: 0.3 }
  fast:   { speed_mps: 1.0, yaw_rate_rps: 2.0, start_radius_m: 0.4, end_radius_m: 0.4 }

# ===== 执行器语义映射 =====
actuators:
  arm_yaw_motor:
    type: motor
    motor_id: 5
    joint_index: 0
    mode: pos_vel
    speed: 3.0
    positions:
      front: 0.0
      back:  3.14
      mid:   1.57

  arm_roll_motor:
    type: motor
    motor_id: 6
    joint_index: 1
    mode: pos_vel
    speed: 3.0
    positions:
      up:    0.0
      down: -1.57
      mid:  -0.78

  arm_gripper:
    type: pneumatic
    index: 0
    states:
      open:  1.0
      close: 0.0

  arm_lift:
    type: pneumatic
    index: 1
    states:
      high: 1.0
      low:  0.0

  arm_stopper:
    type: pneumatic
    index: 2
    states:
      high: 1.0
      low:  0.0

# ===== 任务脚本 =====
stages:
  # --- 导航到中间点 ---
  - id: nav_to_mid
    type: navigate
    to: wp_mid
    profile: normal

  # --- 手臂下放 ---
  - id: arm_down
    type: arm
    arm_yaw_motor: front
    arm_roll_motor: down
    arm_gripper: open
    arm_lift: low
    arm_stopper: low

  # --- 等待 ---
  - id: wait_1
    type: wait
    duration_s: 1.0

  # --- 手臂收回 ---
  - id: arm_up
    type: arm
    arm_yaw_motor: mid
    arm_roll_motor: up
    arm_gripper: close
    arm_lift: high

  # --- 导航到目标点 ---
  - id: nav_to_target
    type: navigate
    to: wp_target
    profile: normal

  # --- 夹爪操作 ---
  - id: gripper_seq
    type: sequential
    steps:
      - { type: arm, arm_gripper: open }
      - { type: wait, duration_s: 0.5 }
      - { type: arm, arm_stopper: high }
      - { type: wait, duration_s: 0.3 }
      - { type: arm, arm_gripper: close }

  # --- 返回起点 ---
  - id: nav_home
    type: navigate
    to: wp_return
    profile: fast

  # --- 结束 ---
  - id: finish
    type: terminate

# ===== 条件跳转示例（需 sensor 条件时启用）=====
#  将下面 block 替换到 stages 中即可使用：
