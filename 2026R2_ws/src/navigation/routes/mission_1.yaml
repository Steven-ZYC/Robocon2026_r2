version: 1
frame_id: map

# ===== 坐标 =====
waypoints:
  wp_start:         { pose: { x: 0.0, y: 0.0, yaw: 0.0 } }
  wp_approach_ball: { pose: { x: 1.2, y: 0.3, yaw: 1.57 } }
  wp_pickup:        { pose: { x: 1.2, y: 0.3, yaw: 1.57 } }
  wp_throw_zone:    { pose: { x: 2.5, y: 0.0, yaw: 3.14 } }
  wp_retry:         { pose: { x: 1.0, y: 0.5, yaw: 1.57 } }

# ===== 导航预设 =====
profiles:
  slow:   { speed_mps: 0.3, yaw_rate_rps: 0.8, start_radius_m: 0.2, end_radius_m: 0.2 }
  normal: { speed_mps: 0.6, yaw_rate_rps: 1.5, start_radius_m: 0.3, end_radius_m: 0.3 }
  fast:   { speed_mps: 1.0, yaw_rate_rps: 2.0, start_radius_m: 0.4, end_radius_m: 0.4 }

# ===== 执行器语义映射 =====
actuators:
  arm_yaw_motor:
    type: motor
    motor_id: 5
    joint_index: 0
    mode: pos_vel
    speed: 3.0
    positions:
      front: 0.0
      back:  3.14
      mid:   1.57

  arm_roll_motor:
    type: motor
    motor_id: 6
    joint_index: 1
    mode: pos_vel
    speed: 3.0
    positions:
      up:    0.0
      down: -1.57
      mid:  -0.78

  arm_gripper:
    type: pneumatic
    index: 0
    states:
      open:  1.0
      close: 0.0

  arm_lift:
    type: pneumatic
    index: 1
    states:
      high: 1.0
      low:  0.0

  arm_stopper:
    type: pneumatic
    index: 2
    states:
      high: 1.0
      low:  0.0

# ===== 任务脚本 =====
stages:
  - id: nav_to_ball
    type: navigate
    to: wp_approach_ball
    profile: normal

  - id: arm_prepare
    type: arm
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_gripper: open
    arm_lift: low
    arm_stopper: low

  - id: fine_approach
    type: navigate
    to: wp_pickup
    profile: slow

  - id: grab
    type: sequential
    steps:
      - { type: arm, arm_gripper: close }
      - { type: wait, duration_s: 0.5 }
      - { type: arm, arm_stopper: high }
      - { type: wait, duration_s: 0.3 }

  - id: arm_lift_object
    type: arm
    arm_yaw_motor: mid
    arm_roll_motor: up
    arm_lift: high

  - id: nav_to_throw
    type: navigate
    to: wp_throw_zone
    profile: fast

  - id: check_ball_present
    type: conditional
    condition:
      topic: /arduino/raw_sensor_data
      field: imu_ax
      op: gt
      value: 0.5
    then: throw_ball
    else: nav_to_retry

  - id: throw_ball
    type: sequential
    steps:
      - { type: arm, arm_yaw_motor: front, arm_roll_motor: down }
      - { type: wait, duration_s: 0.5 }
      - { type: arm, arm_gripper: open }
      - { type: wait, duration_s: 0.3 }
      - { type: arm, arm_yaw_motor: front, arm_roll_motor: up, arm_gripper: close }

  - id: nav_to_retry
    type: navigate
    to: wp_retry
    profile: normal

  - id: finish
    type: terminate
