version: 1
frame_id: map

# ===== Red Area: 简化测试流程 =====
# nav_to_rack → arm_at_rack → wait_stable → nav_to_head_1 → arm_at_head_1 → done

# ===== 坐标 (m, deg) =====
waypoints:
  wp_start:      { pose: { x: 0.0, y: 0.0, yaw: 0.0 } }
  wp_rack:       { pose: { x: 0.0, y: -0.875, yaw: 0.0 } }
  wp_head_1:     { pose: { x: 0.130, y: -0.875, yaw: 0.0 } }

# ===== 导航预设 =====
# XY 分立 PID 模式（与 y_test.sh 一致的 algo 和 PID 值）
profiles:
  slow:
    # Approach/REC tracking profile = 1/4 Red Area profile speed limits.
    speed_mps: 0.1
    yaw_rate_rps: 0.075
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_x: 0.0
    k_i_y: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 0.25
    max_body_y_mps: 0.25
    curve: cubic_ease

  medium:
    speed_mps: 0.4
    yaw_rate_rps: 0.3
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_x: 0.0
    k_i_y: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 1.0
    max_body_y_mps: 1.0
    curve: cubic_ease

  fast:
    speed_mps: 0.4
    yaw_rate_rps: 0.3
    start_radius_m: 0.0
    end_radius_m: 0.0
    min_speed_scale: 0.0
    k_p_x: 0.081
    k_p_y: 0.115
    k_i_x: 0.0
    k_i_y: 0.0
    k_d_x: 0.00156
    k_d_y: 0.25
    k_heading_p: 0.06
    k_heading_d: 0.0
    max_body_x_mps: 1.0
    max_body_y_mps: 1.0
    curve: cubic_ease

# ===== 执行器语义映射 =====
actuators:
  arm_yaw_motor:
    type: motor
    motor_id: 5
    speed: 3.0
    positions:
      front: 0.0
      back:  3.14
      mid:   1.57
      right: 1.57

  arm_roll_motor:
    type: motor
    motor_id: 6
    speed: 3.0
    positions:
      up:    0.0
      down: -1.57
      mid:  -0.78
      right: 1.57

  arm_gripper:
    type: pneumatic
    states: [open, close]

  arm_lift:
    type: pneumatic
    states: [low, high]

  arm_stopper:
    type: pneumatic
    states: [low, high]

# ===== 任务脚本 =====
stages:
  # --- 导航到 weapon head rack ---
  - id: nav_to_rack
    type: navigate
    to: wp_rack
    profile: medium

  # --- 手臂就位 (rack 初始姿态) ---
  - id: arm_at_rack
    type: arm
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_lift: low
    arm_gripper: open
    arm_stopper: low

  # --- 等待手臂稳定 ---
  - id: wait_stable
    type: wait
    duration_s: 1.0

  # --- 移动到 weapon head 1 ---
  - id: nav_to_head_1
    type: navigate
    to: wp_head_1
    profile: slow

  # --- 到达 head 1 后手臂待命 ---
  - id: arm_at_head_1
    type: arm
    arm_yaw_motor: front
    arm_roll_motor: up
    arm_lift: low
    arm_gripper: open
    arm_stopper: low

  # --- IR 检测 weapon head，并按 YAML 内封装的抓取序列执行 ---
  - id: pickup_weapon_head
    type: weapon_head_pickup
    search_mode: scan_until_ir  # 可切换为 step_0p2m
    ir_topic: /arm/ir_status
    ir_field: ir
    ir_timeout_s: 0.5
    slot_count: 6
    slot_spacing_m: 0.2
    on_miss: advance
    scan:
      direction_rad: 0.0
      speed_mps: 0.05
      max_distance_m: 1.0
      timeout_s: 5.0
    step:
      profile: slow
      settle_s: 0.15
      pos_tolerance: 0.03
      yaw_tolerance: 0.1
    pickup_sequence:
      - type: arm
        arm_gripper: close
      - type: wait
        duration_s: 0.1
      - type: arm
        arm_lift: high
        arm_yaw_motor: front

  # --- 任务结束 ---
  - id: done
    type: terminate
