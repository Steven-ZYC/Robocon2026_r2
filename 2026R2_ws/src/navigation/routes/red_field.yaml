# =============================================================================
# Red Field — 比赛场地几何定义
#
# 用途：供 mission_viz_node 渲染场地边界、障碍物、功能区域
# 坐标系：frame_id 指定的坐标系（通常为 map）
# 单位：米 (m)
# 颜色：RGBA，范围 [0, 1]
#
# 蓝场通过 mission_viz_node 的 mirror_y 参数实现 Y 轴镜像，
# 无需单独的 blue_field.yaml。
# =============================================================================

version: 1
field_name: "Red Field"
frame_id: map

# ---- 场地边界（闭合多边形 LINE_STRIP）----
# 红区当前实测草案：车头/world +X 方向 1.2 m，world +Y 方向 1.0 m。
boundary:
  - [0.0, 0.0]
  - [1.2, 0.0]
  - [1.2, 1.0]
  - [0.0, 1.0]
  - [0.0, 0.0]

# ---- 障碍物（CUBE）----
# Y 方向障碍物占据 y=0.875~1.000 m；当前先按横跨整个 X 方向的矩形带建模。
obstacles:
  - name: "top_y_obstacle"
    center: [0.6, 0.9375]
    size: [1.2, 0.125, 0.05]

# ---- 功能区域（半透明 CUBE，贴地平铺）----
# 出发区：0.8 m × 0.8 m，当前按场地原点内角放置。
zones:
  - name: "start_zone"
    center: [0.4, 0.4]
    size: [0.8, 0.8, 0.01]
    color: [0.0, 1.0, 0.0, 0.18]
